# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "57086c819ef5dbe6c9fb7500ab45ee88"
name = "FlexReviews"
application_url = "https://flexreviews-app-production.up.railway.app"
embedded = true

[build]
# `shopify app dev` rewrites application_url, auth.redirect_urls and
# app_proxy.url to the dev tunnel while it runs.
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.app_subscriptions.update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy"
use_legacy_install_flow = false

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [
  "https://flexreviews-app-production.up.railway.app/auth/callback",
  "https://flexreviews-app-production.up.railway.app/auth/shopify/callback",
  "https://flexreviews-app-production.up.railway.app/api/auth/callback"
]

# The storefront block calls {shop}/apps/reviews/api/reviews, served by
# app/routes/api.reviews.tsx.
[app_proxy]
url = "https://flexreviews-app-production.up.railway.app"
subpath = "reviews"
prefix = "apps"

[sidekick]
extensions_summary = "Read review data and ratings for store products"
