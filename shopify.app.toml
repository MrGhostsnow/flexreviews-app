# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "57086c819ef5dbe6c9fb7500ab45ee88"
name = "FlexReviews"
# Production URL of the old reviews-api service. Point this at the new
# Railway service when Phase 1 is deployed.
application_url = "https://reviews-api-production-10bf.up.railway.app"
embedded = true

[build]
# `shopify app dev` rewrites application_url, auth.redirect_urls and
# app_proxy.url to the dev tunnel while it runs.
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"
# No subscriptions in Phase 1. Webhooks (including the mandatory compliance
# topics) are added in Phase 2.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Template default. Final scopes are decided in Phase 2.
scopes = "write_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://reviews-api-production-10bf.up.railway.app/api/auth/callback",
  "https://reviews-api-production-10bf.up.railway.app/api/billing/confirm"
]

# Kept on the old reviews-api service so the storefront block keeps working
# until the Phase 2 cutover.
[app_proxy]
url = "https://reviews-api-production-10bf.up.railway.app"
subpath = "reviews"
prefix = "apps"
