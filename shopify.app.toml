# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "57086c819ef5dbe6c9fb7500ab45ee88"
name = "FlexReviews"
# Still the old reviews-api service. Switched to the new Railway service at
# cutover (see docs/cutover.md).
application_url = "https://reviews-api-production-10bf.up.railway.app"
embedded = true

[build]
# `shopify app dev` rewrites application_url, auth.redirect_urls and
# app_proxy.url to the dev tunnel while it runs.
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Handled by: /app/routes/webhooks.app_subscriptions.update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Handled by: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy"
use_legacy_install_flow = false

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [
  "https://reviews-api-production-10bf.up.railway.app/api/auth/callback",
  "https://reviews-api-production-10bf.up.railway.app/api/billing/confirm"
]

# Kept on the old reviews-api service until cutover (see docs/cutover.md).
# The storefront block calls {shop}/apps/reviews/api/reviews, which both the
# old service and app/routes/api.reviews.tsx serve.
[app_proxy]
url = "https://reviews-api-production-10bf.up.railway.app"
subpath = "reviews"
prefix = "apps"

# Carried over from the live app config so existing FAQ entries are kept.
[metaobjects.app.faq]
name = "FAQ"

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.show_on_faq_page]
name = "Show on FAQ page"
type = "boolean"

[product.metafields.app.faq]
name = "FAQ"
description = "FAQ for this product"
type = "metaobject_reference<$app:faq>"

  [product.metafields.app.faq.access]
  admin = "merchant_read_write"

[sidekick]
extensions_summary = "Read review data and ratings for store products"
