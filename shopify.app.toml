# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "57086c819ef5dbe6c9fb7500ab45ee88"
name = "FlexReviews"
# Production URL of the old reviews-api service. Point this at the new
# Railway service when Phase 1 is deployed.
application_url = "https://reviews-api-production-10bf.up.railway.app"
embedded = true

[build]
# `shopify app dev` rewrites application_url, auth.redirect_urls and
# app_proxy.url to the dev tunnel while it runs.
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"
# No subscriptions in Phase 1. Webhooks (including the mandatory compliance
# topics) are added in Phase 2.

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Template default. Final scopes are decided in Phase 2.
scopes = "write_products"
use_legacy_install_flow = false

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = [
  "https://reviews-api-production-10bf.up.railway.app/api/auth/callback",
  "https://reviews-api-production-10bf.up.railway.app/api/billing/confirm"
]

# Kept on the old reviews-api service so the storefront block keeps working
# until the Phase 2 cutover.
[app_proxy]
url = "https://reviews-api-production-10bf.up.railway.app"
subpath = "reviews"
prefix = "apps"

# Carried over from the live app config so existing FAQ entries are kept.
[metaobjects.app.faq]
name = "FAQ"

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.show_on_faq_page]
name = "Show on FAQ page"
type = "boolean"

[product.metafields.app.faq]
name = "FAQ"
description = "FAQ for this product"
type = "metaobject_reference<$app:faq>"

  [product.metafields.app.faq.access]
  admin = "merchant_read_write"
